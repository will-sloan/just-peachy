config_name: live_mic_whisper_tiny
profile: local_live_mic_whisper_tiny
notes: Live microphone smoke config. Uses full chunk WAVs with Whisper tiny when local
  package and model assets already exist.
future: false
runtime:
  device: cpu
  sample_rate_hz: 16000
  max_batch_size: 1
  num_threads: 1
  precision: float32
  dry_run: false
  allow_model_downloads: false
  cache_dir: models/cache/whisper
components:
  vad:
    name: no_op_vad
    enabled: false
    adapter: NoOpVADAdapter
    params: {}
    notes: null
  segmentation:
    name: no_op_segmentation
    enabled: false
    adapter: NoOpSegmentationAdapter
    params:
      mode: full_chunk
    notes: null
  diarization:
    name: no_op_diarization
    enabled: false
    adapter: NoOpDiarizationAdapter
    params: {}
    notes: null
  asr:
    name: whisper_tiny
    enabled: true
    adapter: WhisperTinyASRAdapter
    params:
      model_family: whisper
      model_size: tiny
      model_name: whisper_tiny
      language: en
      beam_size: 1
      word_timestamps: false
      device: cpu
      dtype: float32
      allow_model_downloads: false
      cache_dir: models/cache/whisper
    notes: Lazy Whisper tiny adapter config. Requires local package and model assets;
      downloads disabled.
  speaker_embedding:
    name: no_op_speaker_embedding
    enabled: false
    adapter: NoOpSpeakerEmbeddingAdapter
    params: {}
    notes: null
  speaker_matching:
    name: no_op_speaker_matching
    enabled: false
    adapter: NoOpSpeakerMatchingAdapter
    params: {}
    notes: null
