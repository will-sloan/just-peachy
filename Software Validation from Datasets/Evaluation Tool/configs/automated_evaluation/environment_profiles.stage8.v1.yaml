schema_version: extended-environment-profiles.v1
profile_contract_version: 1
generated_against_git_commit: e7e5516991b95f4e7c915e852fc0b4f5bae7cd11
secret_policy: Environment-variable presence may be recorded; values must never be read into artifacts.
profiles:
  core-cpu:
    purpose: Preserve the Stage 0-7 qualified CPU reference environment.
    operating_systems: [windows, linux, macos]
    python_version: "3.12"
    requirements: [requirements/dev.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File install.ps1 -Profile dev -Device cpu
    validation_command: .venv\Scripts\python.exe scripts\verify_install.py --profile dev --device cpu --cache-root models/cache --whisper tiny,base,small --require-models
    supported_components: [whisper_tiny, whisper_base, whisper_small, energy_vad, silero_vad, speechbrain_ecapa, cosine_threshold]
    incompatible_components: [nemo_diarization]
    model_assets: [whisper_tiny, whisper_base, whisper_small, speechbrain_ecapa]
    credential_requirements: []
    hardware: {cpu: required, gpu: optional, cuda: not_used}
    expected_verifier_output: Stage 7 core qualification reports nine qualified targets.

  core-cuda:
    purpose: Qualify the core stack on one NVIDIA GPU without modifying core-cpu.
    operating_systems: [windows, linux]
    python_version: "3.12"
    requirements: [requirements/stage8/core-cuda.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File scripts\install_stage8_profile.ps1 -Profile core-cuda
    validation_command: .stage8-envs\core-cuda\Scripts\python.exe scripts\verify_install.py --profile dev --device cuda --cache-root models/cache --whisper tiny,base,small --require-models
    supported_components: [whisper_tiny, whisper_base, whisper_small, silero_vad, speechbrain_ecapa, cosine_threshold]
    incompatible_components: []
    model_assets: [whisper_tiny, whisper_base, whisper_small, speechbrain_ecapa]
    credential_requirements: []
    hardware: {cpu: required, gpu: NVIDIA, cuda: "12.8 wheel runtime"}
    expected_verifier_output: CUDA is PRESENT and each core model produces a real output.

  extended-local:
    purpose: Cross-platform local ASR, VAD, and d-vector qualification isolated from the core environment.
    operating_systems: [windows, linux, macos]
    python_version: "3.12"
    requirements: [requirements/stage8/extended-local.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File scripts\install_stage8_profile.ps1 -Profile extended-local -DownloadModels
    validation_command: .stage8-envs\extended-local\Scripts\python.exe "Software Validation from Datasets\Evaluation Tool\scripts\qualify_extended_backends.py" --profile extended-local
    supported_components: [faster_whisper, vosk, webrtc_vad, resemblyzer, whisper_tiny, whisper_base, whisper_small, energy_vad, silero_vad, vad_chunks, speechbrain_ecapa]
    incompatible_components: [nemo_diarization]
    model_assets: [faster_whisper_tiny, vosk_small_en_us_0_15, resemblyzer_packaged]
    credential_requirements: []
    hardware: {cpu: required, gpu: optional, cuda: optional_unqualified}
    expected_verifier_output: Each installed backend is qualified by two real, offline executions or receives a concrete non-qualified status.

  onnx:
    purpose: Sherpa-ONNX ASR, VAD, speaker embedding, and diarization on CPU.
    operating_systems: [windows, linux, macos]
    python_version: "3.12"
    requirements: [requirements/stage8/onnx.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File scripts\install_stage8_profile.ps1 -Profile onnx -DownloadModels
    validation_command: .stage8-envs\onnx\Scripts\python.exe "Software Validation from Datasets\Evaluation Tool\scripts\qualify_extended_backends.py" --profile onnx
    supported_components: [sherpa_onnx_asr, sherpa_onnx_vad, sherpa_onnx_speaker_embedding, sherpa_onnx_diarization, whisper_tiny, whisper_base, whisper_small, energy_vad, silero_vad, vad_chunks, speechbrain_ecapa]
    incompatible_components: []
    model_assets: [sherpa_onnx_asr, sherpa_onnx_vad, sherpa_onnx_speaker_embedding, sherpa_onnx_diarization_segmentation]
    credential_requirements: []
    hardware: {cpu: required, gpu: optional, cuda: not_used_by_profile}
    expected_verifier_output: All available Sherpa adapters load verified local ONNX files and emit contract-valid outputs.

  wenet:
    purpose: WeNet ASR at v3.1.0 commit 2d8bb9780f5b23da65abee37fd612a1fa2f2f4e8.
    operating_systems: [linux, windows]
    python_version: "3.12"
    requirements: [requirements/stage8/wenet.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File scripts\install_stage8_profile.ps1 -Profile wenet -DownloadModels
    validation_command: .stage8-envs\wenet\Scripts\python.exe "Software Validation from Datasets\Evaluation Tool\scripts\qualify_extended_backends.py" --profile wenet
    supported_components: [wenet]
    incompatible_components: []
    model_assets: [wenet_librispeech_u2pp]
    credential_requirements: []
    hardware: {cpu: required, gpu: optional_unqualified, cuda: optional_unqualified}
    expected_verifier_output: The v3.1.0 package and local checkpoint initialize and produce a real transcript twice.

  wespeaker:
    purpose: WeSpeaker extraction at an immutable source commit, isolated because of legacy dependency metadata.
    operating_systems: [windows, linux, macos]
    python_version: "3.12"
    requirements: [requirements/stage8/wespeaker.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File scripts\install_stage8_profile.ps1 -Profile wespeaker -DownloadModels
    validation_command: .stage8-envs\wespeaker\Scripts\python.exe "Software Validation from Datasets\Evaluation Tool\scripts\qualify_extended_backends.py" --profile wespeaker
    supported_components: [wespeaker, whisper_tiny, whisper_base, whisper_small, energy_vad, silero_vad, vad_chunks, speechbrain_ecapa]
    incompatible_components: []
    model_assets: [wespeaker_voxceleb_resnet221_lm]
    credential_requirements: []
    hardware: {cpu: required, gpu: optional_unqualified, cuda: optional_unqualified}
    expected_verifier_output: A finite normalized embedding is repeatable and minimum-duration behavior is recorded.

  credential-diarization:
    purpose: Credential-gated pyannote Community-1 and Picovoice Falcon qualification.
    operating_systems: [windows, linux, macos]
    python_version: "3.12"
    requirements: [requirements/stage8/credential-diarization.txt]
    installation_command: powershell -ExecutionPolicy Bypass -File scripts\install_stage8_profile.ps1 -Profile credential-diarization -DownloadModels
    validation_command: .stage8-envs\credential-diarization\Scripts\python.exe "Software Validation from Datasets\Evaluation Tool\scripts\qualify_extended_backends.py" --profile credential-diarization
    supported_components: [pyannote_community, picovoice_falcon]
    incompatible_components: []
    model_assets: [pyannote_community_1]
    credential_requirements: [PYANNOTE_AUTH_TOKEN, PICOVOICE_ACCESS_KEY]
    hardware: {cpu: required, gpu: optional, cuda: optional}
    expected_verifier_output: Licence acknowledgement and credential presence are checked without serializing secret values; real turns are required for qualification.

  nemo-linux-cuda:
    purpose: NeMo composite diarization in a dedicated Linux/CUDA environment.
    operating_systems: [linux]
    python_version: "3.12"
    requirements: [requirements/stage8/nemo-linux-cuda.txt]
    installation_command: bash scripts/install_stage8_nemo_linux.sh
    validation_command: python "Software Validation from Datasets/Evaluation Tool/scripts/qualify_extended_backends.py" --profile nemo-linux-cuda
    supported_components: [nemo_diarization]
    incompatible_components: [ordinary_windows_environment]
    model_assets: [nemo_diarization_config, nemo_active_checkpoints]
    credential_requirements: []
    hardware: {cpu: required, gpu: NVIDIA_required, cuda: required}
    expected_verifier_output: Linux, CUDA, pinned NeMo, local active checkpoints, valid anonymous turns, and RTTM conversion all pass.
