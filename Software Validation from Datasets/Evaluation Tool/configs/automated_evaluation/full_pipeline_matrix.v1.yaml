    - {rank: 3, metric: premature_wrong_name_exposure, direction: minimize}
    - {rank: 4, metric: speaker_attributed_word_errors, direction: minimize}
    - {rank: 5, metric: correctly_named_known_speaker_time, direction: maximize}
    - {rank: 6, metric: anonymous_speaker_confusion_and_cluster_contamination, direction: minimize}
    - {rank: 7, metric: time_to_first_readable_text, direction: minimize}
    - {rank: 8, metric: time_to_stable_transcript, direction: minimize}
    - {rank: 9, metric: time_to_stable_correct_speaker_name, direction: minimize}
    - {rank: 10, metric: transcript_and_identity_revisions, direction: minimize}
    - {rank: 11, metric: real_time_operation_and_reliability, direction: maintain}
    - {rank: 12, metric: cpu_ram_model_complexity, direction: minimize_when_scientifically_comparable}
  deployment_rules:
    sherpa_giga_commercially_cleared: false
    sherpa_giga_reason: unresolved_GigaSpeech_training_provenance_commercial_review
    repository_code_redistribution_status: unresolved_no_repository_license_file

