schema_version: core-screening-protocol.v1
seed: 3800
reference_asr: whisper_base
benchmark:
  tier: small
  panel: controlled_clean
  condition_set: smoke
qualification:
  repeated_smokes: 2
  device: cpu
  dtype: float32
  prohibit_model_downloads: true
vad_policy:
  collar_sec: 0.25
  boundary_tolerance_sec: 0.25
  too_short_segment_sec: 0.2
embedding_policy:
  minimum_duration_sec: 0.75
  l2_norm_tolerance: 0.0001
finalist_validation:
  repetitions: 3
advancement:
  asr:
    maximum_candidates: 3
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 1
    objectives:
      - {metric: micro_wer, direction: min, category: accuracy, required: true}
      - {metric: micro_cer, direction: min, category: accuracy, required: true}
      - {metric: valid_output_rate, direction: max, category: reliability, required: true}
      - {metric: worst_condition_micro_wer, direction: min, category: robustness, required: true}
      - {metric: max_condition_wer_degradation_vs_clean, direction: min, category: robustness, required: true}
      - {metric: mean_rtf, direction: min, category: resource, required: false}
  segmentation:
    maximum_candidates: 2
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 1
    objectives:
      - {metric: micro_wer, direction: min, category: accuracy, required: true}
      - {metric: micro_cer, direction: min, category: accuracy, required: true}
      - {metric: valid_output_rate, direction: max, category: reliability, required: true}
      - {metric: worst_condition_micro_wer, direction: min, category: robustness, required: true}
      - {metric: max_condition_wer_degradation_vs_clean, direction: min, category: robustness, required: true}
      - {metric: vad.speech_f1, direction: max, category: accuracy, required: false}
      - {metric: mean_rtf, direction: min, category: resource, required: false}
  targeted_combinations:
    maximum_candidates: 3
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 1
    objectives:
      - {metric: micro_wer, direction: min, category: accuracy, required: true}
      - {metric: micro_cer, direction: min, category: accuracy, required: true}
      - {metric: valid_output_rate, direction: max, category: reliability, required: true}
      - {metric: worst_condition_micro_wer, direction: min, category: robustness, required: true}
      - {metric: max_condition_wer_degradation_vs_clean, direction: min, category: robustness, required: true}
      - {metric: mean_rtf, direction: min, category: resource, required: false}
notes:
  - Whisper Base is the configurable reference ASR for VAD and segmentation screening.
  - Missing and failed predictions remain in accuracy and reliability denominators.
  - A slower component is retained when it offers a non-dominated accuracy, reliability, or robustness tradeoff.
  - Speaker verification, identification, calibration, and unknown-rejection metrics are reserved for Stage 10.
