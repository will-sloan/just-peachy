excluded_asr_markers:
  - medium
  - large
  - turbo

readiness_status_vocabulary:
  - qualified
  - qualified_with_warnings
  - contract_qualified
  - unavailable
  - unavailable_asset
  - credential_required
  - licence_action_required
  - asset_required
  - platform_required
  - incompatible_environment
  - license_review_required
  - commercial_use_unverified
  - pending_decision
  - excluded

final_use_categories:
