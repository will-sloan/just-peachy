profiles:
  core_cpu_development:
    purpose: "Stage 0 contract work and real CPU qualification of the core local pipeline."
    status: qualified_with_path_mismatch
    install_profile: dev
    requirements: [requirements/core.txt, requirements/inference.txt, requirements/dev.txt]
    device: cpu
    torch_build: 2.11.0+cpu
    components:
      - energy_vad
      - silero_vad
      - vad_chunks
      - whisper_tiny
      - whisper_base
      - whisper_small
      - speechbrain_ecapa
      - cosine_threshold
      - disabled/no-op and fixed test components
    setup_commands:
      anaconda_prompt:
        - "cd /d C:\\Users\\amiri\\Documents\\GitHub\\just-peachy"
        - "py -3.12 -m venv .venv"
        - ".venv\\Scripts\\activate"
        - "powershell -ExecutionPolicy Bypass -File scripts\\install.ps1 -Profile dev -Device cpu"
      verification:
        - "python scripts\\verify_install.py --profile dev --device cpu --cache-root models/cache --whisper tiny,base,small --require-models"
        - "python -m pip check"
    known_mismatches:
      - "Restart the terminal, or add the WinGet FFmpeg bin directory to PATH, then rerun verification."

  core_cuda:
    purpose: "Immediate next gate after CPU contract qualification; required before standard/large benchmarks or model selection."
    status: qualified
    install_profile: core-cuda
    requirements: [requirements/stage8/core-cuda.txt]
    device: cuda:0
    dtype: float32
    torch_build: 2.11.0+cu128
    torch_cuda_runtime: "12.8"
    cudnn: 91900
    hardware_observed: "RTX 3080 10 GiB; conservative one GPU-heavy scenario at a time."
    components: [silero_vad, whisper_tiny, whisper_base, whisper_small, speechbrain_ecapa, cosine_threshold]
    setup_commands:
      - "powershell -ExecutionPolicy Bypass -File scripts\\install_stage8_profile.ps1 -Profile core-cuda"
      - ".stage8-envs\\core-cuda\\Scripts\\python.exe scripts\\verify_install.py --profile dev --device cuda --cache-root models/cache --whisper base --require-models"
      - "python scripts\\run_cuda_qualification.py --max-recordings 5 from the Evaluation Tool with core-cuda active"
    blockers: []
    qualification_evidence:
      - "Real one-item ordinary evaluator: 1 prediction, 0 failures, 0 missing, 11 plots, report present, cuda:0, nonzero VRAM."
      - "Five identical CMU Arctic records: CUDA float32 and float16 each produced 5/5 predictions with transcripts identical to CPU float32."
      - "CUDA float32 selected operationally because measured inference speedup was 1.79x versus CPU, compared with 1.36x for float16."
    qualification_gate: "Machine-specific full assignment preflight and scientific canary/small/standard gates remain required."

  extended_local_backends:
    purpose: "Optional local CPU/GPU adapters that are not blockers for the core benchmark."
    status: unavailable
    install_profile: full
    requirements: [requirements/full.txt, requirements/optional.txt, requirements/speaker_backends.txt]
    components: [faster_whisper, vosk, wenet, webrtc_vad, resemblyzer, wespeaker]
    setup_commands:
      - "powershell -ExecutionPolicy Bypass -File scripts\\install.ps1 -Profile full -Device cpu"
      - "python scripts\\bootstrap_models.py --cache-root models/cache --all-optional"
      - "python scripts\\qualify_speech_components.py --audio <real-speech.wav> --output runs/component_qualification/extended_local.json"
    blockers: ["Packages and/or local assets are not installed in the current environment."]

  onnx_backends:
    purpose: "Isolated Sherpa-ONNX VAD, ASR, embedding, and diarization qualification."
    status: unavailable
    install_profile: full
    requirements: [requirements/optional.txt]
    components: [sherpa_onnx_vad, sherpa_onnx, sherpa_onnx_libri_giga_zipformer_2023_06_21, sherpa_onnx_speaker_embedding, sherpa_onnx_diarization]
    setup_commands:
      - "Install the pinned sherpa-onnx requirement in this profile."
      - "Bootstrap each SHA-256-verified Sherpa asset with scripts\\bootstrap_models.py."
      - "Qualify ONNX components independently before any targeted combination test."
    blockers: ["sherpa-onnx package absent", "local ONNX assets absent"]

  credential_gated_diarization:
    purpose: "Pyannote Community and Picovoice Falcon without exposing credentials."
    status: credential_required
    install_profile: full
    requirements: [requirements/optional.txt]
    components: [pyannote_community, picovoice_falcon]
    credential_environment_variables: [PYANNOTE_AUTH_TOKEN, PICOVOICE_ACCESS_KEY]
    setup_commands:
      - "Accept the applicable upstream terms personally."
      - "Set the credential only in the process environment or an approved secret manager."
      - "Never place credentials in YAML, JSON, logs, reports, shell history, or transferred artifacts."
      - "Run isolated qualification and inspect artifacts for accidental secret leakage."
    blockers: ["Terms/credentials not supplied", "packages and model assets absent"]

  linux_cuda_nemo:
    purpose: "Platform-specific NeMo diarization qualification."
    status: platform_required
    install_profile: nemo
    requirements: [requirements/nemo.txt]
    device: cuda
    supported_os: [linux]
    components: [nemo_diarization]
    setup_commands:
      - "Create a separate Linux Python 3.12 CUDA environment."
      - "Install a pinned CUDA Torch build, then the pinned NeMo profile."
      - "Bootstrap and checksum the diarization config/model assets."
      - "Run real single-scenario qualification before any comparison."
    blockers: ["Current host is Windows", "CUDA profile not built", "NeMo assets absent"]

  test_only_contract:
    purpose: "Fast deterministic interface, identity, error-path, and resume-contract tests with no performance claims."
    status: qualified
    install_profile: dev
    requirements: [requirements/core.txt, requirements/dev.txt]
    device: cpu
    components: [all_no_op_components, fixed_vad, fixed_segmentation, fixed_asr, fixed_diarization, deterministic_fake_speaker_embedding, dummy_components]
    setup_commands:
      - "python -m pytest tests/inference_pipeline tests/automated_evaluation -q"
    restrictions:
      - "Never report fake/stub outputs as model accuracy, latency, or readiness evidence."

