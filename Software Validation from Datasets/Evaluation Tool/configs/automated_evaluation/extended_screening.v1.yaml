schema_version: extended-screening-protocol.v1
seed: 3800
reference_asr: whisper_base
benchmark:
  panel: controlled_clean
  tier: small
  condition_set: smoke
  identical_item_policy: source_metadata_hash
core_controls:
  asr: [whisper_tiny, whisper_base, whisper_small]
  vad_strategies: [full_record, energy_observe, energy_chunks, silero_observe, silero_chunks]
  speaker_embedding: [speechbrain_ecapa]
qualification:
  summary_path: runs/extended_backend_qualification/qualification_summary.json
  registry_path: configs/automated_evaluation/extended_qualification_registry.v1.yaml
  eligible_statuses: [qualified, qualified_with_warnings]
  repetitions: 2
screening:
  asr_segmentation: full_record
  asr_speaker_processing: false
  asr_diarization: false
  vad_chunker_suffix: _chunks
  embedding_segments: fixed_full_record
  diarization_scope: composition_only
  repetitions_for_finalists: 3
advancement:
  asr:
    maximum_candidates: 4
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 1
    objectives:
      - {metric: micro_wer, direction: min, category: accuracy}
      - {metric: macro_wer, direction: min, category: accuracy}
      - {metric: valid_output_rate, direction: max, category: reliability}
      - {metric: worst_condition_micro_wer, direction: min, category: robustness, required: false}
      - {metric: mean_rtf, direction: min, category: resource, required: false}
  segmentation:
    maximum_candidates: 3
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 1
    objectives:
      - {metric: micro_wer, direction: min, category: accuracy}
      - {metric: valid_output_rate, direction: max, category: reliability}
      - {metric: vad_metrics.speech_f1, direction: max, category: accuracy, required: false}
      - {metric: mean_rtf, direction: min, category: resource, required: false}
  targeted_combinations:
    maximum_candidates: 3
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 1
    objectives:
      - {metric: micro_wer, direction: min, category: accuracy}
      - {metric: valid_output_rate, direction: max, category: reliability}
      - {metric: mean_rtf, direction: min, category: resource, required: false}
  embedding:
    maximum_candidates: 3
    minimum_valid_output_rate: 0.95
    maximum_failure_rate: 0.05
    maximum_timeout_rate: 0.0
    maximum_oom_rate: 0.0
    minimum_repetitions: 2
    objectives:
      - {metric: extraction_success_rate, direction: max, category: reliability}
      - {metric: invalid_or_nonfinite_vectors, direction: min, category: reliability}
      - {metric: clean_to_degraded_cosine_drift.mean, direction: min, category: robustness, required: false}
      - {metric: mean_extraction_sec, direction: min, category: resource, required: false}
comparison_policy:
  model_quality: compare identical item sets across environments; do not attribute runtime differences to model quality
  runtime_implementation: compare only within an environment and hardware group
  hardware_performance: group by OS, CPU, GPU, CUDA, environment profile, and package-freeze identity
  environment_compatibility: report observations separately from quality and performance
  opaque_composite_score: forbidden
forbidden_metrics: [EER, FAR, FRR, identification, calibration, unknown_rejection, DER, JER]
