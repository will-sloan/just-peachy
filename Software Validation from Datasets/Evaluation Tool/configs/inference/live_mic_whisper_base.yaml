config_name: live_mic_whisper_base
profile: local_live_mic_whisper_base
notes: Live microphone smoke config. Uses full chunk WAVs with Whisper base when local package and model assets already exist.
future: false
runtime:
  device: cpu
  sample_rate_hz: 16000
  max_batch_size: 1
  num_threads: 1
  precision: float32
  dry_run: false
  allow_model_downloads: false
  cache_dir: models/cache/whisper
components:
  vad:
    name: no_op_vad
    enabled: false
    adapter: NoOpVADAdapter
    params: {}
  segmentation:
    name: no_op_segmentation
    enabled: false
    adapter: NoOpSegmentationAdapter
    params:
      mode: full_chunk
  diarization:
    name: no_op_diarization
    enabled: false
    adapter: NoOpDiarizationAdapter
    params: {}
  asr: components/asr/whisper_base.yaml
  speaker_embedding:
    name: no_op_speaker_embedding
    enabled: false
    adapter: NoOpSpeakerEmbeddingAdapter
    params: {}
  speaker_matching:
    name: no_op_speaker_matching
    enabled: false
    adapter: NoOpSpeakerMatchingAdapter
    params: {}
