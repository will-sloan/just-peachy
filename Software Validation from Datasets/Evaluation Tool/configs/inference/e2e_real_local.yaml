config_name: e2e_real_local
profile: local_cpu_real_models
notes: M14 local real-model profile. Uses Whisper tiny and SpeechBrain ECAPA only when their assets are already cached locally; downloads remain disabled.
future: false
runtime:
  device: cpu
  sample_rate_hz: 16000
  max_batch_size: 1
  num_threads: 1
  precision: float32
  dry_run: false
  allow_model_downloads: false
  cache_dir: models/cache
audio:
  target_sample_rate_hz: 16000
  channel_policy: mono
diagnostics:
  enabled: true
  file_name: pipeline_diagnostics.jsonl
enrollment:
  db_path: artifacts/enrollment/enrollment_db.json
components:
  vad:
    name: energy_vad
    enabled: true
    adapter: EnergyVADAdapter
    params:
      threshold: 0.02
      min_speech_ms: 100
      min_silence_ms: 100
      pad_ms: 20
      sample_rate: 16000
  segmentation:
    name: vad_chunks
    enabled: true
    adapter: VADChunkerAdapter
    params:
      target: asr
      min_chunk_sec: 0.1
      max_chunk_sec: 30.0
      merge_gap_sec: 0.2
      left_pad_sec: 0.0
      right_pad_sec: 0.0
      clip_to_record_bounds: true
  asr:
    name: whisper_tiny
    enabled: true
    adapter: WhisperTinyASRAdapter
    params:
      model_family: whisper
      model_size: tiny
      model_name: whisper_tiny
      language: en
      beam_size: 1
      word_timestamps: false
      device: cpu
      dtype: float32
      allow_model_downloads: false
      cache_dir: models/cache/whisper
  speaker_embedding:
    name: speechbrain_ecapa
    enabled: true
    adapter: SpeechBrainECAPAAdapter
    params:
      model_family: speechbrain
      architecture: ecapa_tdnn
      model_source: speechbrain/spkrec-ecapa-voxceleb
      model_name: speechbrain_ecapa@1.1.0
      savedir: models/cache/speechbrain/spkrec-ecapa-voxceleb
      embedding_dim: 192
      sample_rate_hz: 16000
      min_duration_sec: 0.75
      device: cpu
      dtype: float32
      allow_model_downloads: false
  speaker_matching:
    name: cosine_threshold
    enabled: true
    adapter: CosineThresholdSpeakerMatcher
    params:
      threshold: 0.82
      min_margin: 0.05
      unknown_label: Unknown
      scoring_mode: centroid
      enforce_model_id: true
      runtime_model_id: speechbrain_ecapa@1.1.0
      conservative_max_false_known_rate: 0.0
