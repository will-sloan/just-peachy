config_name: e2e_named_transcript
profile: local_cpu_e2e_named_transcript
notes: M13 end-to-end runner config using offline-safe components and no model downloads.
future: false
runtime:
  device: cpu
  sample_rate_hz: 16000
  max_batch_size: 1
  num_threads: 1
  precision: float32
  dry_run: false
  allow_model_downloads: false
  cache_dir: null
components:
  vad:
    name: energy_vad
    enabled: true
    adapter: EnergyVADAdapter
    params:
      threshold: 0.01
      min_speech_ms: 100
      min_silence_ms: 100
      pad_ms: 0
      sample_rate: 16000
  segmentation:
    name: vad_chunks
    enabled: true
    adapter: VADChunkerAdapter
    params:
      target: asr
      min_chunk_sec: 0.05
      max_chunk_sec: 30.0
      merge_gap_sec: 0.2
      left_pad_sec: 0.0
      right_pad_sec: 0.0
      clip_to_record_bounds: true
  asr:
    name: no_op_asr
    enabled: true
    adapter: NoOpASRAdapter
    params:
      transcript: dummy pipeline transcript
  speaker_embedding:
    name: no_op_speaker_embedding
    enabled: true
    adapter: NoOpSpeakerEmbeddingAdapter
    params: {}
  speaker_matching:
    name: no_op_speaker_matching
    enabled: true
    adapter: NoOpSpeakerMatchingAdapter
    params:
      unknown_label: Unknown
