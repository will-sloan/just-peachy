component:
  slot: asr
  name: whisper_large_v2
  enabled: true
  adapter: WhisperLargeV2ASRAdapter
  notes: OpenAI Whisper large-v2 checkpoint; CUDA and substantial VRAM are recommended.
  params:
    model_family: whisper
    model_size: large-v2
    model_name: whisper_large_v2
    language: en
    beam_size: 1
    word_timestamps: false
    device: cuda
    dtype: float16
    allow_model_downloads: false
    cache_dir: models/cache/whisper
