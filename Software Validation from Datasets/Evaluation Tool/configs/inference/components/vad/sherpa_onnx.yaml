component:
  slot: vad
  name: sherpa_onnx_vad
  enabled: true
  adapter: SherpaOnnxVAD
  notes: Sherpa-ONNX wrapper around the local Silero VAD ONNX model.
  params:
    model_path: models/cache/sherpa_onnx/vad/silero_vad.onnx
    threshold: 0.5
    min_speech_ms: 250
    min_silence_ms: 100
    max_speech_duration_sec: 20.0
    buffer_size_sec: 60.0
    window_size: 512
    num_threads: 1
    provider: cpu
    sample_rate: 16000

