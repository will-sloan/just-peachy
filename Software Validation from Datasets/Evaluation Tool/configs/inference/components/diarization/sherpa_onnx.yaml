component:
  slot: diarization
  name: sherpa_onnx_diarization
  enabled: true
  adapter: SherpaOnnxDiarizer
  notes: Fully local Sherpa-ONNX diarization with pyannote segmentation, speaker embeddings, and clustering.
  params:
    model_source: sherpa-onnx
    segmentation_model_path: models/cache/sherpa_onnx/diarization/sherpa-onnx-pyannote-segmentation-3-0/model.onnx
    embedding_model_path: models/cache/sherpa_onnx/speaker_embedding/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
    num_clusters: -1
    clustering_threshold: 0.5
    min_turn_sec: 0.05
    min_duration_on: 0.3
    min_duration_off: 0.5
    num_threads: 1
    provider: cpu
