component:
  slot: diarization
  name: modular_energy_wespeaker
  enabled: true
  adapter: ModularClusteringDiarizer
  notes: Engineering-readiness path D; energy speech regions, the exact existing WeSpeaker ResNet221-LM embedding, and anonymous deterministic clustering.
  params:
    model_source: modular/energy-wespeaker-resnet221-lm
    segmentation_source: energy_vad
    embedding_component_config: configs/inference/components/speaker_embedding/wespeaker.yaml
    clustering_policy_id: diarization_energy_wespeaker_resnet221_lm_engineering_v1
    clustering_threshold: 0.5
    window_duration_sec: 1.5
    window_step_sec: 0.75
    min_embedding_window_sec: 0.75
    min_turn_sec: 0.05
    min_speakers: null
    max_speakers: null
    device: cpu
    energy_vad: {threshold: 0.01, min_speech_ms: 250, min_silence_ms: 100, pad_ms: 0, sample_rate: 16000}
    allow_model_downloads: false
