component:
  slot: speaker_embedding
  name: speechbrain_ecapa
  enabled: true
  adapter: SpeechBrainECAPAAdapter
  notes: Lazy SpeechBrain ECAPA adapter; local assets are required unless downloads are explicitly enabled.
  params:
    model_family: speechbrain
    architecture: ecapa_tdnn
    model_source: speechbrain/spkrec-ecapa-voxceleb
    savedir: models/cache/speechbrain/spkrec-ecapa-voxceleb
    embedding_dim: 192
    sample_rate_hz: 16000
    min_duration_sec: 0.75
    dtype: float32
    allow_model_downloads: false
