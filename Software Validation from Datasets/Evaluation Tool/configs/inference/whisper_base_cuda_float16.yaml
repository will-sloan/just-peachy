config_name: whisper_base_cuda_float16
profile: core-cuda
notes: Real offline Whisper Base operational pipeline on explicit CUDA device 0 using float16. Local assets are mandatory and downloads are disabled.
future: false
runtime:
  device: cuda:0
  sample_rate_hz: 16000
  max_batch_size: 1
  num_threads: 1
  precision: float16
  dry_run: false
  allow_model_downloads: false
  cache_dir: models/cache/whisper
components:
  vad:
    name: no_op_vad
    enabled: false
    adapter: NoOpVADAdapter
    params: {}
  segmentation:
    name: no_op_segmentation
    enabled: false
    adapter: NoOpSegmentationAdapter
    params:
      mode: full_record
  diarization:
    name: no_op_diarization
    enabled: false
    adapter: NoOpDiarizationAdapter
    params: {}
  asr:
    name: whisper_base
    enabled: true
    adapter: WhisperBaseASRAdapter
    notes: Explicit CUDA float16 launch configuration for the qualified local Whisper Base checkpoint.
    params:
      model_family: whisper
      model_size: base
      model_name: whisper_base
      language: en
      beam_size: 1
      word_timestamps: false
      device: cuda:0
      dtype: float16
      allow_model_downloads: false
      cache_dir: models/cache/whisper
  speaker_embedding:
    name: no_op_speaker_embedding
    enabled: false
    adapter: NoOpSpeakerEmbeddingAdapter
    params: {}
  speaker_matching:
    name: no_op_speaker_matching
    enabled: false
    adapter: NoOpSpeakerMatchingAdapter
    params: {}
