
PLL_SERVICER_RESID:
  dedicated_commands:
    - cmd: PLL_LOCK_STATUS
      number_of_values: 1
      type: CMD_READ_ONLY
      help: Returns the lock status of the audio PLL used for generating MCLK (for builds where it is used). It may
        return one of the following - -1 input frequency too low to track; 0 pll output is locked to input; 1 input
        frequency is too high to track
        Note that the PLL status is only valid when the external clock source is active (eg. I2S is running for int-dev.
        See I2S_INACTIVE to check this), or when running in USB Audio adaptive mode (UA)
      value_type: TYPE_INT32
      hidden: false
  shared_commands:
  external_commands:
