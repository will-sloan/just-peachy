# Process-local research configuration; never install as a system/user default.
# Explicit hw PCM/control templates, with no conversion/mixer/plugin aliases.
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default 0 }
    @args.DEV { type integer default 0 }
    @args.SUBDEV { type integer default -1 }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}
ctl.hw {
    @args [ CARD ]
    @args.CARD { type string default 0 }
    type hw
    card $CARD
}
